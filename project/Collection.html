<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sheets · store.bestlist.ai</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Patrick+Hand&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <style>
      html {
        scroll-behavior: smooth;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fafaf7;
        font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #0e1226;
        -webkit-font-smoothing: antialiased;
      }
      * {
        box-sizing: border-box;
      }
      ::selection {
        background: #2a5bff;
        color: #fff;
      }
    </style>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"

    <script

      crossorigin="anonymous"
    ></script>

  <body>
    <div id="root"></div>

    <script type="text/babel" src="hero-shared.jsx"></script>
    <script type="text/babel" src="landing-misc.jsx"></script>
    <script type="text/babel" src="collection-hero.jsx"></script>
    <script type="text/babel" src="collection-grid.jsx"></script>

    <script type="text/babel" data-presets="react">
      function App() {
        const [active, setActive] = React.useState("all");

        // smooth scroll to grid when filter changes
        React.useEffect(() => {
          // skip on initial mount
        }, []);

        return (
          <div>
            <LandingHeader />
            <CollectionHero active={active} setActive={setActive} />
            <CollectionMantra active={active} />
            <CollectionGrid active={active} />
            <CollectionBottomCTA />
            <LandingFooter />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
