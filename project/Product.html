const _P   = _CMS.product  || {};
const _S   = (_CMS.settings || {});
const _H   = _S.hero        || {};
const _SP  = _S.socialProof || {};

const CMS_PRODUCT_NAME  = _P.name          || 'Master Budget Tracker Pro';

const CMS_CTA           = _H.ctaText       || 'Sở hữu hệ thống ngay';

// ─── SHARED PRIMITIVES ───────────────────────────────────────────────────────

function HandUnderline({ color = "#1f4dd8", strokeWidth = 5 }) {
  return (
    <svg viewBox="0 0 260 22" preserveAspectRatio="none" style={{ position:"absolute", left:"-4%", right:"-4%", bottom:-10, width:"108%", height:22, pointerEvents:"none", overflow:"visible" }}>
      <path d="M3 13 C 40 6, 80 18, 130 11 S 220 6, 257 12" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" opacity="0.85"/>
    </svg>
  );
}

function StickyNote({ children, bg="#fff2a8", rotate=-4, shadow="0 12px 28px rgba(40,30,0,0.18), 0 2px 4px rgba(40,30,0,0.08)", width=200, height=220, pin=true, pinColor="#e23b3b", style={} }) {
  return (
    <div style={{ position:"relative", width, height, background:bg, transform:`rotate(${rotate}deg)`, boxShadow:shadow, padding:"22px 18px 18px", borderRadius:2, clipPath:"polygon(0% 1%, 99% 0%, 100% 99%, 1% 100%)", fontFamily:"'Caveat', 'Patrick Hand', cursive", ...style }}>
      {pin && <div style={{ position:"absolute", top:-6, left:"50%", transform:"translateX(-50%)", width:12, height:12, borderRadius:"50%", background:pinColor, boxShadow:"inset -2px -2px 3px rgba(0,0,0,0.25), 0 2px 3px rgba(0,0,0,0.25)" }}/>}
      {children}
    </div>
  );
}

// ─── HEADER ──────────────────────────────────────────────────────────────────

function LandingHeader() {
  const accent = "#2A5BFF", ink = "#0E1226", muted = "rgba(14,18,38,0.65)";
  const [scrolled, setScrolled] = React.useState(false);
  React.useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 20);
    window.addEventListener("scroll", fn);
    return () => window.removeEventListener("scroll", fn);
  }, []);
  const items = [
    { l:"Tài chính", h:"#finance" }, { l:"Sức khỏe", h:"#health" },
    { l:"Mối quan hệ", h:"#relations" }, { l:"Vì sao Bestlist", h:"#why" }, { l:"Bảng giá", h:"#pricing" }

    <header style={{ position:"sticky", top:0, zIndex:100, background: scrolled ? "rgba(250,250,247,0.85)" : "transparent", backdropFilter: scrolled ? "blur(12px)" : "none", WebkitBackdropFilter: scrolled ? "blur(12px)" : "none", borderBottom: scrolled ? "1px solid rgba(14,18,38,0.06)" : "1px solid transparent", transition:"all .25s ease" }}>

          <div style={{ width:32, height:32, background:accent, borderRadius:9, display:"flex", alignItems:"center", justifyContent:"center" }}>
            <svg width="18" height="18" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" fill="#fff"/><path d="M8 8 H 16 M 8 11 H 16 M 8 14 H 16 M 8 17 H 13" stroke={accent} strokeWidth="1.8" strokeLinecap="round"/></svg>
          </div>
          store.bestlist.ai
        </a>
        <nav style={{ display:"flex", gap:32 }}>
          {items.map(x => (
            <a key={x.l} href={x.h} style={{ color:muted, fontSize:14, fontWeight:500, textDecoration:"none", transition:"color .15s" }} onMouseEnter={e=>e.currentTarget.style.color=ink} onMouseLeave={e=>e.currentTarget.style.color=muted}>{x.l}</a>

        </div>

// ─── STICKY BUY BAR ──────────────────────────────────────────────────────────

function StickyBuyBar() {
  const accent = "#2A5BFF", ink = "#0E1226";
  const [show, setShow] = React.useState(false);
  React.useEffect(() => {
