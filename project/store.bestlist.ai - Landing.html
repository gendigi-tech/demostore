              position: "absolute",
              left: "-4%",
              right: "-4%",

      function StickyNote({

        width = 200,

        pinColor = "#e23b3b",
        style = {},
      }) {
        return (
          <div
            style={{
              position: "relative",
              width,
              height,
              background: bg,
              transform: `rotate(${rotate}deg)`,
              boxShadow: shadow,
              padding: "22px 18px 18px",
              borderRadius: 2,
              clipPath: "polygon(0% 1%, 99% 0%, 100% 99%, 1% 100%)",
              fontFamily: "'Caveat', 'Patrick Hand', cursive",
